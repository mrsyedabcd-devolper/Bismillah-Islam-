name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download project from release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download v1 --repo "${{ github.repository }}" -p bismillah.zip
          unzip -o -q bismillah.zip
          rm -f bismillah.zip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create platform folders
        run: |
          flutter create --org com.orbitislam --project-name orbit_islam --platforms=android .
          python3 tool/patch_platforms.py

      - name: Get packages
        run: flutter pub get

      - name: Test prayer, Hijri and data
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: bismillah-islam-apk
          path: build/app/outputs/flutter-apk/app-release.apk
